<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AR Rahimi</title>

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
          rel="stylesheet">


    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        :root {

            --bg: #05060b;

            --white: #ffffff;

            --muted:
                rgba(255,255,255,.58);

            --glass:
                rgba(255,255,255,.075);

            --glass-light:
                rgba(255,255,255,.11);

            --border:
                rgba(255,255,255,.13);

        }


        html {
            scroll-behavior: smooth;
        }


        body {

            min-height: 100vh;

            font-family:
                "Vazirmatn",
                sans-serif;

            color: var(--white);

            background:

                radial-gradient(
                    circle at 15% 5%,
                    rgba(110,70,255,.27),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 90% 20%,
                    rgba(0,180,255,.16),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(145,40,255,.20),
                    transparent 35%
                ),

                #05060b;

            overflow-x: hidden;

            position: relative;
        }


        /* ==================================
           شبکه بسیار ظریف پس زمینه
        ================================== */

        body::before {

            content: "";

            position: fixed;

            inset: 0;

            pointer-events: none;

            opacity: .16;

            background-image:

                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),

                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size:
                45px 45px;

            mask-image:
                linear-gradient(
                    to bottom,
                    black,
                    transparent 85%
                );

        }


        /* ==================================
           نورهای متحرک
        ================================== */

        .orb {

            position: fixed;

            border-radius: 50%;

            pointer-events: none;

            filter: blur(90px);

            z-index: -1;

            mix-blend-mode: screen;

        }


        .orb1 {

            width: 330px;
            height: 330px;

            background:
                rgba(105,70,255,.22);

            top: -130px;
            right: -100px;

            animation:
                orbOne 11s ease-in-out infinite alternate;

        }


        .orb2 {

            width: 300px;
            height: 300px;

            background:
                rgba(0,160,255,.16);

            bottom: -100px;
            left: -100px;

            animation:
                orbTwo 13s ease-in-out infinite alternate;

        }


        .orb3 {

            width: 180px;
            height: 180px;

            background:
                rgba(180,60,255,.12);

            top: 45%;
            left: 35%;

            animation:
                orbThree 9s ease-in-out infinite alternate;

        }


        @keyframes orbOne {

            from {
                transform:
                    translate(0,0)
                    scale(1);
            }

            to {
                transform:
                    translate(-100px,100px)
                    scale(1.25);
            }

        }


        @keyframes orbTwo {

            from {
                transform:
                    translate(0,0)
                    scale(1);
            }

            to {
                transform:
                    translate(100px,-100px)
                    scale(1.2);
            }

        }


        @keyframes orbThree {

            from {
                transform:
                    translate(-40px,-20px);
            }

            to {
                transform:
                    translate(50px,50px);
            }

        }


        /* ==================================
           کانتینر
        ================================== */

        .container {

            width:
                min(
                    620px,
                    calc(100% - 28px)
                );

            margin: auto;

            padding:
                60px 0 45px;

        }


        /* ==================================
           پروفایل
        ================================== */

        .profile {

            text-align: center;

            opacity: 0;

            animation:
                profileAppear
                1.1s
                cubic-bezier(.16,1,.3,1)
                forwards;

        }


        @keyframes profileAppear {

            from {

                opacity: 0;

                transform:
                    translateY(45px)
                    scale(.92);

                filter:
                    blur(10px);

            }

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

                filter:
                    blur(0);

            }

        }


        /* ==================================
           عکس پروفایل
        ================================== */

        .profile-ring {

            position: relative;

            width: 124px;
            height: 124px;

            margin: auto;

            padding: 3px;

            border-radius: 50%;

            background:

                conic-gradient(
                    from 0deg,
                    #7658ff,
                    #b59cff,
                    #28c8ff,
                    #7658ff
                );

            animation:
                ringRotate
                7s
                linear
                infinite;

            box-shadow:

                0 0 25px
                rgba(110,80,255,.35),

                0 0 70px
                rgba(110,80,255,.13);

        }


        @keyframes ringRotate {

            to {
                transform:
                    rotate(360deg);
            }

        }


        .profile-ring::before {

            content: "";

            position: absolute;

            inset: -9px;

            border-radius: 50%;

            border:
                1px solid
                rgba(150,120,255,.22);

            animation:
                pulseRing
                3s
                ease-in-out
                infinite;

        }


        @keyframes pulseRing {

            0%,100% {

                transform:
                    scale(.95);

                opacity: .3;

            }

            50% {

                transform:
                    scale(1.08);

                opacity: .7;

            }

        }


        .profile-image {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border:
                4px solid #07080d;

            display: block;

            animation:
                imageAppear
                1.2s
                ease
                both;

        }


        @keyframes imageAppear {

            from {

                opacity: 0;

                transform:
                    scale(.75);

            }

            to {

                opacity: 1;

                transform:
                    scale(1);

            }

        }


        .name {

            margin-top: 25px;

            font-size: 30px;

            font-weight: 800;

            letter-spacing: -.8px;

            text-shadow:
                0 0 25px
                rgba(255,255,255,.08);

        }


        .username {

            margin-top: 5px;

            color:
                rgba(255,255,255,.50);

            font-size: 14px;

        }


        .bio {

            max-width: 500px;

            margin:
                18px auto 0;

            color:
                rgba(255,255,255,.66);

            font-size: 14px;

            line-height: 2;

        }


        /* ==================================
           لینک ها
        ================================== */

        .links {

            margin-top: 42px;

            display:
                flex;

            flex-direction:
                column;

            gap: 15px;

        }


        /* ==================================
           کارت شیشه ای
        ================================== */

        .link-card {

            position: relative;

            min-height: 82px;

            display: flex;

            align-items: center;

            gap: 16px;

            padding:
                13px 17px;

            text-decoration: none;

            color: white;

            border-radius: 24px;

            border:
                1px solid
                var(--border);

            background:

                linear-gradient(
                    135deg,
                    rgba(255,255,255,.105),
                    rgba(255,255,255,.035)
                );

            backdrop-filter:
                blur(25px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(25px)
                saturate(150%);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,.10),

                inset 0 -1px 0
                rgba(255,255,255,.025),

                0 20px 50px
                rgba(0,0,0,.20);

            overflow: hidden;

            opacity: 0;

            transform:
                translateY(35px)
                scale(.97);

            animation:
                cardAppear
                .85s
                cubic-bezier(.16,1,.3,1)
                forwards;

            transition:
                transform .45s
                cubic-bezier(.16,1,.3,1),

                border-color .4s,

                box-shadow .4s;

        }


        /* ورود مرحله ای */

        .link-card:nth-child(1) {
            animation-delay: .18s;
        }

        .link-card:nth-child(2) {
            animation-delay: .30s;
        }

        .link-card:nth-child(3) {
            animation-delay: .42s;
        }

        .link-card:nth-child(4) {
            animation-delay: .54s;
        }

        .link-card:nth-child(5) {
            animation-delay: .66s;
        }


        @keyframes cardAppear {

            to {

                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);

            }

        }


        /* ==================================
           خط نورانی که از روی کارت رد می شود
        ================================== */

        .link-card::after {

            content: "";

            position: absolute;

            top: 0;
            bottom: 0;

            width: 80px;

            left: -120px;

            background:

                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.14),
                    transparent
                );

            transform:
                skewX(-18deg);

            transition:
                left .8s ease;

            pointer-events: none;

        }


        .link-card:hover::after {

            left: 120%;

        }


        /* ==================================
           هاله نور کارت
        ================================== */

        .link-card::before {

            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            left: -150px;
            top: -150px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle,
                    rgba(125,95,255,.17),
                    transparent 70%
                );

            transition:
                .6s ease;

            pointer-events: none;

        }


        .link-card:hover::before {

            transform:
                translate(180px,180px);

        }


        .link-card:hover {

            transform:
                translateY(-5px)
                scale(1.012);

            border-color:
                rgba(170,150,255,.25);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,.14),

                0 25px 65px
                rgba(0,0,0,.30),

                0 0 35px
                rgba(100,80,255,.08);

        }


        .link-card:active {

            transform:
                scale(.975);

        }


        /* ==================================
           لوگو
        ================================== */

        .app-icon {

            position: relative;

            z-index: 2;

            width: 54px;
            height: 54px;

            flex-shrink: 0;

            padding: 7px;

            object-fit: contain;

            border-radius: 17px;

            background:
                rgba(255,255,255,.075);

            border:
                1px solid
                rgba(255,255,255,.09);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,.12),

                0 8px 25px
                rgba(0,0,0,.18);

            transition:
                .45s
                cubic-bezier(.16,1,.3,1);

        }


        .link-card:hover .app-icon {

            transform:
                scale(1.1)
                rotate(-4deg);

            box-shadow:

                0 8px 30px
                rgba(120,90,255,.16);

        }


        /* ==================================
           متن
        ================================== */

        .link-info {

            position: relative;

            z-index: 2;

            flex: 1;

            text-align: right;

        }


        .link-title {

            font-size: 16px;

            font-weight: 700;

        }


        .link-description {

            margin-top: 4px;

            font-size: 12px;

            color:
                rgba(255,255,255,.53);

        }


        /* ==================================
           فلش
        ================================== */

        .arrow {

            position: relative;

            z-index: 2;

            width: 38px;
            height: 38px;

            display: grid;

            place-items: center;

            border-radius: 50%;

            background:
                rgba(255,255,255,.055);

            border:
                1px solid
                rgba(255,255,255,.06);

            color:
                rgba(255,255,255,.62);

            font-size: 18px;

            transition:
                .4s
                cubic-bezier(.16,1,.3,1);

        }


        .link-card:hover .arrow {

            transform:
                translateX(-6px);

            background:
                rgba(255,255,255,.11);

            color: white;

        }


        /* ==================================
           فوتر
        ================================== */

        .footer {

            margin-top: 48px;

            text-align: center;

            font-size: 11px;

            color:
                rgba(255,255,255,.25);

            opacity: 0;

            animation:
                footerAppear
                1s
                ease
                1.1s
                forwards;

        }


        @keyframes footerAppear {

            to {
                opacity: 1;
            }

        }


        /* ==================================
           موبایل
        ================================== */

        @media (max-width: 500px) {

            .container {

                width:
                    calc(100% - 22px);

                padding-top: 48px;

            }


            .profile-ring {

                width: 108px;
                height: 108px;

            }


            .name {

                font-size: 27px;

            }


            .bio {

                font-size: 13px;

                padding:
                    0 5px;

            }


            .link-card {

                min-height: 78px;

                border-radius: 21px;

                padding:
                    11px 14px;

            }


            .app-icon {

                width: 50px;
                height: 50px;

                border-radius: 15px;

            }


            .arrow {

                width: 35px;
                height: 35px;

            }

        }


        /* ==================================
           کاهش انیمیشن برای دستگاه هایی
           که این گزینه را فعال کرده اند
        ================================== */

        @media (prefers-reduced-motion: reduce) {

            *,
            *::before,
            *::after {

                animation-duration:
                    .01ms !important;

                animation-iteration-count:
                    1 !important;

                transition-duration:
                    .01ms !important;

            }

        }

    </style>

</head>


<body>

    </main>


</body>
