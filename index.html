<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>AR Rahimi</title>

    <!-- فونت -->
    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >


    <style>

        /* =========================
           تنظیمات اصلی
        ========================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --background: #07070b;
            --text: #ffffff;
            --muted: rgba(255,255,255,0.58);
            --border: rgba(255,255,255,0.10);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;

            font-family: "Vazirmatn", sans-serif;

            color: var(--text);

            background:
                radial-gradient(
                    circle at 20% 10%,
                    rgba(111, 76, 255, 0.20),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 80% 30%,
                    rgba(0, 180, 255, 0.12),
                    transparent 30%
                ),

                radial-gradient(
                    circle at 50% 100%,
                    rgba(180, 40, 255, 0.12),
                    transparent 35%
                ),

                var(--background);

            overflow-x: hidden;
        }


        /* =========================
           نورهای متحرک پس زمینه
        ========================= */

        .light {
            position: fixed;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            filter: blur(100px);

            opacity: 0.15;

            pointer-events: none;

            z-index: -1;
        }

        .light.one {
            background: #6d4aff;

            top: -150px;
            right: -100px;

            animation:
                floatOne 8s ease-in-out infinite alternate;
        }

        .light.two {
            background: #00aaff;

            bottom: -150px;
            left: -100px;

            animation:
                floatTwo 10s ease-in-out infinite alternate;
        }

        @keyframes floatOne {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(-80px, 70px);
            }

        }

        @keyframes floatTwo {

            from {
                transform: translate(0, 0);
            }

            to {
                transform: translate(90px, -60px);
            }

        }


        /* =========================
           کانتینر اصلی
        ========================= */

        .container {

            width: min(
                620px,
                calc(100% - 32px)
            );

            margin: auto;

            padding:
                65px 0 45px;
        }


        /* =========================
           پروفایل
        ========================= */

        .profile {

            text-align: center;

            animation:
                profileIn 1s
                cubic-bezier(.2,.8,.2,1)
                both;
        }

        @keyframes profileIn {

            from {
                opacity: 0;

                transform:
                    translateY(35px)
                    scale(.94);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* قاب عکس */

        .profile-image-wrapper {

            width: 112px;
            height: 112px;

            margin: auto;

            padding: 3px;

            border-radius: 50%;

            background:
                linear-gradient(
                    135deg,
                    #ffffff,
                    #755cff,
                    #00c6ff,
                    #ffffff
                );

            background-size: 300% 300%;

            animation:
                gradientMove 5s ease infinite;

            box-shadow:
                0 0 35px
                rgba(115, 85, 255, .28);
        }

        @keyframes gradientMove {

            0% {
                background-position: 0% 50%;
            }

            50% {
                background-position: 100% 50%;
            }

            100% {
                background-position: 0% 50%;
            }

        }


        /* عکس پروفایل */

        .profile-image {

            width: 100%;
            height: 100%;

            object-fit: cover;

            border-radius: 50%;

            border:
                3px solid #09090d;

            display: block;
        }


        /* نام */

        .name {

            margin-top: 22px;

            font-size: 28px;

            font-weight: 800;

            letter-spacing: -1px;
        }


        /* یوزرنیم */

        .username {

            margin-top: 5px;

            font-size: 14px;

            color: var(--muted);
        }


        /* توضیحات */

        .bio {

            max-width: 470px;

            margin:
                17px auto 0;

            line-height: 1.9;

            font-size: 14px;

            color:
                rgba(255,255,255,.68);
        }


        /* =========================
           کارت ها
        ========================= */

        .links {

            margin-top: 38px;

            display: flex;

            flex-direction: column;

            gap: 14px;
        }


        .link-card {

            position: relative;

            display: flex;

            align-items: center;

            gap: 16px;

            min-height: 76px;

            padding: 12px 16px;

            text-decoration: none;

            color: white;


            /* شیشه ای */

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );


            border:
                1px solid var(--border);

            border-radius: 22px;


            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);


            box-shadow:
                0 15px 45px
                rgba(0,0,0,.18);


            overflow: hidden;


            /* حالت اولیه انیمیشن */

            opacity: 0;

            transform:
                translateY(25px);


            animation:
                cardIn .7s
                cubic-bezier(.2,.8,.2,1)
                forwards;
        }


        /* زمان ورود هر کارت */

        .link-card:nth-child(1) {
            animation-delay: .15s;
        }

        .link-card:nth-child(2) {
            animation-delay: .25s;
        }

        .link-card:nth-child(3) {
            animation-delay: .35s;
        }

        .link-card:nth-child(4) {
            animation-delay: .45s;
        }

        .link-card:nth-child(5) {
            animation-delay: .55s;
        }


        @keyframes cardIn {

            to {

                opacity: 1;

                transform:
                    translateY(0);
            }

        }


        /* =========================
           نور روی کارت
        ========================= */

        .link-card::before {

            content: "";

            position: absolute;

            width: 180px;
            height: 180px;

            background:
                radial-gradient(
                    circle,
                    rgba(255,255,255,.11),
                    transparent 70%
                );

            top: -120px;
            left: -120px;

            transition:
                .6s ease;

            pointer-events: none;
        }


        .link-card:hover::before {

            transform:
                translate(
                    190px,
                    190px
                );
        }


        /* =========================
           هاور کارت
        ========================= */

        .link-card:hover {

            transform:
                translateY(-4px)
                scale(1.012);

            border-color:
                rgba(255,255,255,.20);

            box-shadow:

                0 20px 55px
                rgba(0,0,0,.28),

                0 0 30px
                rgba(110,90,255,.08);
        }


        /* حالت لمس */

        .link-card:active {

            transform:
                scale(.975);
        }


        /* =========================
           لوگوی اپلیکیشن
        ========================= */

        .app-icon {

            width: 50px;
            height: 50px;

            flex-shrink: 0;

            border-radius: 15px;

            object-fit: contain;

            background:
                rgba(255,255,255,.07);

            padding: 6px;

            transition:
                .4s
                cubic-bezier(.2,.8,.2,1);
        }


        .link-card:hover .app-icon {

            transform:
                scale(1.08)
                rotate(-3deg);
        }


        /* =========================
           متن کارت
        ========================= */

        .link-info {

            flex: 1;

            text-align: right;
        }


        .link-title {

            font-size: 15px;

            font-weight: 700;
        }


        .link-description {

            margin-top: 4px;

            font-size: 12px;

            color: var(--muted);
        }


        /* =========================
           فلش
        ========================= */

        .arrow {

            width: 34px;
            height: 34px;

            border-radius: 50%;

            display: grid;

            place-items: center;

            background:
                rgba(255,255,255,.055);

            color:
                rgba(255,255,255,.65);

            font-size: 17px;

            transition:
                .35s;
        }


        .link-card:hover .arrow {

            transform:
                translateX(-5px);

            background:
                rgba(255,255,255,.10);

            color: white;
        }


        /* =========================
           فوتر
        ========================= */

        .footer {

            text-align: center;

            margin-top: 45px;

            color:
                rgba(255,255,255,.28);

            font-size: 11px;

            animation:
                fadeIn 1s ease 1s both;
        }


        @keyframes fadeIn {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           موبایل
        ========================= */

        @media (max-width: 500px) {

            .container {

                width:
                    calc(100% - 24px);

                padding-top: 45px;
            }


            .profile-image-wrapper {

                width: 100px;
                height: 100px;
            }


            .name {

                font-size: 25px;
            }


            .link-card {

                min-height: 72px;

                border-radius: 19px;
            }


            .app-icon {

                width: 46px;
                height: 46px;
            }

        }

    </style>

</head>
