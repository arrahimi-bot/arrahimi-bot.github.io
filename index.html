<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>علیرضا رحیمی</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: 'Vazirmatn', sans-serif;
            color: #fff;

            background:
                radial-gradient(circle at 50% 0%,
                    rgba(0, 183, 255, 0.20),
                    transparent 35%),

                radial-gradient(circle at 0% 80%,
                    rgba(112, 0, 255, 0.14),
                    transparent 30%),

                radial-gradient(circle at 100% 60%,
                    rgba(255, 0, 170, 0.10),
                    transparent 30%),

                #05070c;

            display: flex;
            justify-content: center;
            overflow-x: hidden;
        }

        /* پس زمینه شبکه ای */

        body::before {
            content: "";
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,0.025) 1px,
                    transparent 1px
                );

            background-size: 45px 45px;

            mask-image: linear-gradient(
                to bottom,
                black,
                transparent
            );

            pointer-events: none;
        }

        /* نورهای شناور */

        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .25;
            pointer-events: none;
            animation: floating 7s ease-in-out infinite;
        }

        .orb.one {
            width: 180px;
            height: 180px;
            background: #00c8ff;
            top: 10%;
            left: -80px;
        }

        .orb.two {
            width: 200px;
            height: 200px;
            background: #732cff;
            bottom: 5%;
            right: -100px;
            animation-delay: -3s;
        }

        @keyframes floating {
            0%,100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-35px);
            }
        }

        /* کانتینر */

        .container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;

            padding:
                55px
                22px
                40px;

            position: relative;
            z-index: 2;
        }

        /* پروفایل */

        .profile {
            text-align: center;

            animation:
                profileEnter
                1s
                ease
                forwards;
        }

        @keyframes profileEnter {

            from {
                opacity: 0;
                transform: translateY(-25px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }

        /* عکس */

        .profile-image-wrapper {
            width: 145px;
            height: 145px;

            margin:
                0
                auto
                25px;

            position: relative;
        }

        .profile-image-wrapper::before {

            content: "";

            position: absolute;

            inset: -14px;

            border-radius: 50%;

            background:
                conic-gradient(
                    #00eaff,
                    #673cff,
                    #ff2bd6,
                    #00eaff
                );

            filter: blur(16px);

            opacity: .55;
          animation:
                rotate
                5s
                linear
                infinite;
        }

        .profile-image-wrapper::after {

            content: "";

            position: absolute;

            inset: -5px;

            border-radius: 50%;

            background:
                conic-gradient(
                    #00eaff,
                    #673cff,
                    #ff2bd6,
                    #00eaff
                );

            animation:
                rotate
                5s
                linear
                infinite;

            z-index: -1;
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }

        }

        .profile-image {

            width: 145px;
            height: 145px;

            border-radius: 50%;

            object-fit: cover;

            border:
                4px solid
                #080b11;

            background:
                linear-gradient(
                    145deg,
                    #161b25,
                    #05070b
                );

            box-shadow:
                0 0 30px
                rgba(0,210,255,.30),

                0 0 70px
                rgba(110,50,255,.20);

            display: block;
        }

        /* تا وقتی عکس نداریم */

        .profile-image:not([src]),
        .profile-image[src=""] {
            background: #10151e;
        }

        /* نام */

        .name {

            font-size: 30px;

            font-weight: 700;

            margin-bottom: 8px;

            background:
                linear-gradient(
                    90deg,
                    #ffffff,
                    #c8f6ff,
                    #ffffff
                );

            -webkit-background-clip: text;

            -webkit-text-fill-color:
                transparent;

            text-shadow:
                0 0 30px
                rgba(255,255,255,.12);
        }

        .subtitle {

            color: #758194;

            font-size: 13px;

            margin-bottom: 38px;
        }

        /* کارت ها */

        .info-list {

            display:
                flex;

            flex-direction:
                column;

            gap: 15px;
        }

        .info-card {

            min-height: 76px;

            display:
                flex;

            align-items:
                center;

            gap: 16px;

            padding:
                13px
                15px;

            border-radius: 21px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.075),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,.07),

                0 15px 35px
                rgba(0,0,0,.28);

            backdrop-filter:
                blur(18px);

            -webkit-backdrop-filter:
                blur(18px);

            position: relative;

            overflow: hidden;

            opacity: 0;

            transform:
                translateY(25px);

            animation:
                cardEnter
                .7s
                ease
                forwards;
        }

        .info-card:nth-child(1) {
            animation-delay: .15s;
        }

        .info-card:nth-child(2) {
            animation-delay: .25s;
        }

        .info-card:nth-child(3) {
            animation-delay: .35s;
        }

        .info-card:nth-child(4) {
            animation-delay: .45s;
        }

        .info-card:nth-child(5) {
            animation-delay: .55s;
        }

        @keyframes cardEnter {

            to {
                opacity: 1;

                transform:
                    translateY(0);
            }

        }

        /* افکت نور عبوری */

        .info-card::before {
          content: "";

            position: absolute;

            width: 120px;
            height: 150%;

            top: -25%;
            right: -170px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(255,255,255,.09),
                    transparent
                );

            transform:
                skewX(-20deg);

            transition:
                .8s;
        }

        .info-card:hover::before {
            right: 120%;
        }

        .info-card:hover {

            transform:
                translateY(-3px)
                scale(1.015);

            border-color:
                rgba(0,210,255,.25);

            box-shadow:
                0 15px 45px
                rgba(0,0,0,.4),

                0 0 30px
                rgba(0,200,255,.08);
        }

        /* آیکون */

        .icon {

            width: 49px;
            height: 49px;

            min-width: 49px;

            border-radius: 16px;

            display:
                flex;

            align-items:
                center;

            justify-content:
                center;

            font-size: 22px;

            background:
                linear-gradient(
                    145deg,
                    rgba(255,255,255,.13),
                    rgba(255,255,255,.025)
                );

            border:
                1px solid
                rgba(255,255,255,.12);

            box-shadow:

                inset 0 2px 2px
                rgba(255,255,255,.08),

                inset 0 -6px 10px
                rgba(0,0,0,.35),

                0 8px 15px
                rgba(0,0,0,.3);

            transition:
                .35s;

            transform-style:
                preserve-3d;
        }

        .info-card:hover .icon {

            transform:
                perspective(400px)
                rotateX(8deg)
                rotateY(-12deg)
                translateZ(8px)
                scale(1.08);
        }

        /* رنگ آیکون ها */

        .phone .icon {
            color: #42dcff;
            text-shadow:
                0 0 15px
                rgba(66,220,255,.8);
        }

        .telegram .icon {
            color: #36aee2;
            text-shadow:
                0 0 15px
                rgba(54,174,226,.8);
        }

        .instagram .icon {
            color: #ff55b8;
            text-shadow:
                0 0 15px
                rgba(255,85,184,.8);
        }

        .bale .icon {
            color: #ffe052;
            text-shadow:
                0 0 15px
                rgba(255,224,82,.8);
        }

        .eitaa .icon {
            color: #ff9b4a;
            text-shadow:
                0 0 15px
                rgba(255,155,74,.8);
        }

        /* متن */

        .info-text {

            display:
                flex;

            flex-direction:
                column;

            gap: 2px;

            overflow: hidden;
        }

        .label {

            font-size: 12px;

            color: #778396;
        }

        .value {

            font-size: 16px;

            font-weight: 700;

            color: #f4f8fc;

            direction: ltr;

            text-align: right;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }

        /* فوتر */

        .footer {

            text-align: center;

            margin-top: 38px;

            color: #3e4858;

            font-size: 10px;
        }

        /* موبایل */

        @media(max-width:380px) {

            .container {
                padding:
                    40px
                    16px
                    30px;
            }

            .profile-image-wrapper,
            .profile-image {

                width: 125px;
                height: 125px;
            }

            .name {
                font-size: 27px;
            }

            .value {
                font-size: 14px;
            }

        }
      </style>
</head>

<body>

    <div class="orb one"></div>
    <div class="orb two"></div>

    <main class="container">

        <!-- PROFILE -->

        <section class="profile">

            <div class="profile-image-wrapper">

                <img
                    src="profile.jpg"
                    alt="علیرضا رحیمی"
                    class="profile-image"
                >

            </div>

            <h1 class="name">
                علیرضا رحیمی
            </h1>

            <div class="subtitle">
                اطلاعات تماس و شبکه‌های اجتماعی
            </div>

        </section>


        <!-- INFORMATION -->

        <section class="info-list">

            <div class="info-card phone">

                <div class="icon">
                    ☎
                </div>

                <div class="info-text">

                    <span class="label">
                        شماره تماس
                    </span>

                    <span class="value">
                        09132681897
                    </span>

                </div>

            </div>


            <div class="info-card telegram">

                <div class="icon">
                    ✈
                </div>

                <div class="info-text">

                    <span class="label">
                        تلگرام
                    </span>

                    <span class="value">
                        @arrahimi
                    </span>

                </div>

            </div>


            <div class="info-card instagram">

                <div class="icon">
                    ◎
                </div>

                <div class="info-text">

                    <span class="label">
                        اینستاگرام
                    </span>

                    <span class="value">
                        @ar.rahimiiii
                    </span>

                </div>

            </div>


            <div class="info-card bale">

                <div class="icon">
                    ◈
                </div>

                <div class="info-text">

                    <span class="label">
                        بله
                    </span>

                    <span class="value">
                        @arr0000
                    </span>

                </div>

            </div>


            <div class="info-card eitaa">

                <div class="icon">
                    ✦
                </div>

                <div class="info-text">

                    <span class="label">
                        ایتا
                    </span>

                    <span class="value">
                        @arr0000
                    </span>

                </div>

            </div>

        </section>


        <footer class="footer">
            © 2026
        </footer>

    </main>

</body>
</html>
